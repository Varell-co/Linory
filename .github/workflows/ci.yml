name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Build
        run: swift build
      - name: Run core checks
        run: swift run LyricsCoreChecks
      - name: Build app bundle
        run: LINORY_APP_DIR="$PWD" bash build-app.sh
      - name: Build universal preview archive
        run: bash build-release.sh "${{ env.VERSION }}"
      - name: Verify packaged app
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          ditto -x -k "dist/Linory-${{ env.VERSION }}-universal.zip" "$RUNNER_TEMP/verify"
          APP="$RUNNER_TEMP/verify/Linory.app"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "${{ env.VERSION }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "io.github.mikeleonfox.lyricsoverlay"
          for KEY in CFBundleName CFBundleDisplayName CFBundleExecutable; do
            test "$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Contents/Info.plist")" = "Linory"
          done
          test -f "$APP/Contents/Resources/Linory.icns"
          codesign --verify --verbose=2 "$APP"
          for ARCH in arm64 x86_64; do lipo "$APP/Contents/MacOS/Linory" -verify_arch "$ARCH"; done
      - name: Upload preview archive
        uses: actions/upload-artifact@v4
        with:
          name: Linory-${{ env.VERSION }}-universal
          path: dist/Linory-${{ env.VERSION }}-universal.zip
          if-no-files-found: error
