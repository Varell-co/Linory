<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Illustration of the Linory overlay">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#AFC9F1"/><stop offset=".55" stop-color="#76A3EE"/><stop offset="1" stop-color="#557FCE"/></linearGradient>
<linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#AFC9F1"/><stop offset="1" stop-color="#4385EF"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14161B" flood-opacity=".28"/></filter>
<filter id="blur"><feGaussianBlur stdDeviation="1.2"/></filter>
<clipPath id="c"><rect width="880" height="400" rx="20"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="880" height="400" fill="url(#bg)"/>
<path d="M-40 300 C120 220 260 230 400 280 S700 360 920 250 L920 400 L-40 400Z" fill="#4385EF" opacity=".35"/>
<path d="M-40 120 C140 60 300 70 460 120 S760 170 920 80 L920 0 L-40 0Z" fill="#F2F4F7" opacity=".22"/>
</g>
<g filter="url(#sh)"><rect x="150" y="70" width="580" height="260" rx="22" fill="#14161B" fill-opacity=".72"/></g>
<rect x="150.5" y="70.5" width="579" height="259" rx="21.5" fill="none" stroke="#F2F4F7" stroke-opacity=".12"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Helvetica Neue', sans-serif">
<rect x="166" y="86" width="36" height="36" rx="6" fill="url(#art)"/>
<text x="214" y="101" fill="#F2F4F7" font-size="15" font-weight="600">Song title</text>
<text x="214" y="119" fill="#BCC5D2" font-size="13">Artist</text>
<g fill="#BCC5D2"><circle cx="704" cy="104" r="1.8"/><circle cx="710" cy="104" r="1.8"/><circle cx="698" cy="104" r="1.8"/></g>
<text x="166" y="158" fill="#F2F4F7" fill-opacity=".14" font-size="19" font-weight="600" filter="url(#blur)">Quiet lines drift above your work</text>
<text x="166" y="190" fill="#F2F4F7" fill-opacity=".42" font-size="19" font-weight="600">Every word arrives on time</text>
<text x="166" y="232" font-size="25" font-weight="600"><tspan fill="#F2F4F7">Keep the words</tspan><tspan fill="#F2F4F7" fill-opacity=".3"> in view</tspan></text>
<text x="166" y="270" fill="#F2F4F7" fill-opacity=".42" font-size="19" font-weight="600">without breaking your focus</text>
<text x="166" y="302" fill="#F2F4F7" fill-opacity=".14" font-size="19" font-weight="600" filter="url(#blur)">Lyrics in your flow</text>
</g>
</svg>
